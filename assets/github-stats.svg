<svg width="1100" height="230" viewBox="0 0 1100 230"
xmlns="http://www.w3.org/2000/svg" role="img"
aria-label="GitHub activity for shin0biX">

<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1100" y2="0">
    <stop offset="0%" stop-color="#58A6FF"/>
    <stop offset="50%" stop-color="#A371F7"/>
    <stop offset="100%" stop-color="#58A6FF"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="1100" height="230" rx="14" fill="#0D1117"/>
<rect x="1" y="1" width="1098" height="228" rx="14"
      fill="none" stroke="#30363D"/>

<!-- Header -->
<circle cx="42" cy="38" r="5" fill="#3FB950" filter="url(#glow)">
  <animate attributeName="opacity"
           values="1;0.35;1"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<text x="58" y="43"
      fill="#8B949E"
      font-family="monospace"
      font-size="13"
      letter-spacing="1">
  ACTIVITY // LIVE
</text>

<text x="1058" y="43"
      text-anchor="end"
      fill="#484F58"
      font-family="monospace"
      font-size="11">
  UPDATED 28 AUG 2026
</text>

<line x1="32" y1="65" x2="1068" y2="65"
      stroke="#21262D"/>

<!-- Stats -->
<g font-family="monospace">

  <!-- Contributions -->
  <text x="170" y="125"
        text-anchor="middle"
        fill="#C9D1D9"
        font-size="34"
        font-weight="bold">77</text>

  <text x="170" y="155"
        text-anchor="middle"
        fill="#8B949E"
        font-size="11"
        letter-spacing="1">CONTRIBUTIONS / 365D</text>

  <!-- Repositories -->
  <text x="410" y="125"
        text-anchor="middle"
        fill="#58A6FF"
        font-size="34"
        font-weight="bold">9</text>

  <text x="410" y="155"
        text-anchor="middle"
        fill="#8B949E"
        font-size="11"
        letter-spacing="1">PUBLIC REPOSITORIES</text>

  <!-- Stars -->
  <text x="650" y="125"
        text-anchor="middle"
        fill="#A371F7"
        font-size="34"
        font-weight="bold">9</text>

  <text x="650" y="155"
        text-anchor="middle"
        fill="#8B949E"
        font-size="11"
        letter-spacing="1">TOTAL STARS</text>

  <!-- Languages -->
  <text x="900" y="119"
        text-anchor="middle"
        fill="#C9D1D9"
        font-size="18"
        font-weight="bold">CSS · HTML · Python</text>

  <text x="900" y="155"
        text-anchor="middle"
        fill="#8B949E"
        font-size="11"
        letter-spacing="1">TOP LANGUAGES</text>

</g>

<!-- Vertical separators -->
<line x1="290" y1="88" x2="290" y2="165" stroke="#21262D"/>
<line x1="530" y1="88" x2="530" y2="165" stroke="#21262D"/>
<line x1="770" y1="88" x2="770" y2="165" stroke="#21262D"/>

<!-- Bottom system line -->
<line x1="32" y1="194" x2="1068" y2="194"
      stroke="url(#accent)" stroke-width="1" opacity="0.5"/>

<circle r="3" fill="#58A6FF">
  <animateMotion
    path="M32,194 L1068,194"
    dur="6s"
    repeatCount="indefinite"/>
</circle>

<text x="550" y="215"
      text-anchor="middle"
      fill="#484F58"
      font-family="monospace"
      font-size="10"
      letter-spacing="2">
  SHIN0BIX // BUILD • UNDERSTAND • IMPROVE
</text>

</svg>
