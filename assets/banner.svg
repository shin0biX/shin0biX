<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="300">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>

    <linearGradient id="title" x1="350" y1="0" x2="850" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#C9D1D9"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="14" fill="#0D1117"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)" opacity="0.45"/>

  <!-- Animated scanning line -->
  <rect y="0" width="1200" height="1" fill="#58A6FF" opacity="0.3">
    <animate attributeName="y" values="20;280;20" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="298" rx="14"
        stroke="url(#border)" stroke-width="2" opacity="0.8"/>

  <!-- Terminal header -->
  <circle cx="38" cy="35" r="6" fill="#58A6FF"/>
  <circle cx="58" cy="35" r="6" fill="#A371F7"/>
  <circle cx="78" cy="35" r="6" fill="#3FB950"/>

  <text x="105" y="41"
        fill="#8B949E"
        font-family="monospace"
        font-size="14">
    system@shin0biX:~$
  </text>

  <!-- System status -->
  <circle cx="1030" cy="35" r="5" fill="#3FB950" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="1045" y="40"
        fill="#8B949E"
        font-family="monospace"
        font-size="13">
    SYSTEM ONLINE
  </text>

  <!-- Decorative data lines -->
  <g opacity="0.45">
    <path d="M70 95 H250" stroke="#58A6FF" stroke-width="1"/>
    <path d="M950 95 H1130" stroke="#A371F7" stroke-width="1"/>
    <circle cx="250" cy="95" r="3" fill="#58A6FF">
      <animate attributeName="cx" values="70;250;70" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="95" r="3" fill="#A371F7">
      <animate attributeName="cx" values="950;1130;950" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main identity -->
  <text x="600" y="155"
        text-anchor="middle"
        fill="url(#title)"
        font-family="monospace"
        font-size="52"
        font-weight="bold"
        letter-spacing="2">
    shin0biX
  </text>

  <!-- Blinking cursor -->
  <rect x="785" y="117" width="12" height="43" fill="#58A6FF">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="600" y="205"
        text-anchor="middle"
        fill="#C9D1D9"
        font-family="monospace"
        font-size="16"
        letter-spacing="1.5">
    BUILDING SYSTEMS // LEARNING HOW THEY WORK
  </text>

  <!-- Bottom labels -->
  <g font-family="monospace" font-size="12" fill="#8B949E">
    <text x="330" y="255">[ FULL-STACK DEVELOPMENT ]</text>
    <text x="590" y="255" fill="#58A6FF">◇</text>
    <text x="625" y="255">[ CYBERSECURITY ]</text>
    <text x="810" y="255" fill="#A371F7">◇</text>
    <text x="845" y="255">[ ALWAYS LEARNING ]</text>
  </g>

  <!-- Corner decorations -->
  <path d="M20 270 V280 H30" stroke="#58A6FF" stroke-width="2" opacity="0.7"/>
  <path d="M1180 270 V280 H1170" stroke="#A371F7" stroke-width="2" opacity="0.7"/>
</svg>
